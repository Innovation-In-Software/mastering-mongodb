<text x="145.0" y="187.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1a1a1a">Structured</text>
<text x="145.0" y="214.8" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666666">Tables · fixed schema</text>
