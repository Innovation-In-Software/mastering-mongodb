<text x="460" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1a1a1a">Application data is no longer one rigid table shape</text>
<text x="460" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666666">Traditional structured data  →  hierarchical, varied, continuously changing</text>
<text x="460" y="310" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666666">Modern apps mix all three — the model must follow the access pattern</text>
