<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 396" width="920" height="396">
<defs>
  <marker id="ae11" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#cc0000"/>
  </marker>
</defs>
<rect width="920" height="396" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
<text x="460" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">mongod vs. mongosh</text>
<rect x="24" y="50" width="430" height="48" rx="10" fill="#ffebeb" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cc0000">mongod — server</text>
<rect x="466" y="50" width="430" height="48" rx="10" fill="#ffebeb" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cc0000">mongosh — client</text>
<rect x="24" y="106" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="132.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Stores data</text>
<rect x="466" y="106" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="132.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Sends commands</text>
<rect x="24" y="158" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="184.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Processes operations</text>
<rect x="466" y="158" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="184.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Interactive JavaScript shell</text>
<rect x="24" y="210" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="236.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Manages files and indexes</text>
<rect x="466" y="210" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="236.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Not the database</text>
<rect x="24" y="262" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="288.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Writes logs</text>
<rect x="466" y="262" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="288.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Same data as Compass</text>
<rect x="24" y="314" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="340.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Enforces security</text>
<rect x="466" y="314" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="340.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Connects over the URI</text>
<text x="460" y="384" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">A common misconception: mongosh is not the MongoDB server</text>
</svg>
