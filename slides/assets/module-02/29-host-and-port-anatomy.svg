<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="920" height="260">
<defs>
  <marker id="ae29" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#cc0000"/>
  </marker>
</defs>
<rect width="920" height="260" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
<text x="460" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Host and port anatomy</text>
<rect x="20.0" y="48" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="162.66666666666666" y="85.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">Hostname</text>
<text x="162.66666666666666" y="100.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">db.example.net</text>
<rect x="317.3333333333333" y="48" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="460.0" y="85.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">IP address</text>
<text x="460.0" y="100.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">Resolved by DNS</text>
<rect x="614.6666666666666" y="48" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="757.3333333333333" y="85.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">Port</text>
<text x="757.3333333333333" y="100.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">Default 27017</text>
<rect x="20.0" y="144" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="162.66666666666666" y="181.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">Network interface</text>
<text x="162.66666666666666" y="196.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">bindIp</text>
<rect x="317.3333333333333" y="144" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="460.0" y="181.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">Firewall boundary</text>
<text x="460.0" y="196.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">May block 27017</text>
<rect x="614.6666666666666" y="144" width="285.3333333333333" height="84" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="757.3333333333333" y="181.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#1a1a1a">Localhost</text>
<text x="757.3333333333333" y="196.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#666666">Loopback only</text>
<text x="460" y="248" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">Wrong host, wrong port, or a closed firewall all look like “cannot connect”</text>
</svg>
