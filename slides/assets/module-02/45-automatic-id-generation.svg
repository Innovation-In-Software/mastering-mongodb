<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250">
<defs>
  <marker id="ae45" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#cc0000"/>
  </marker>
</defs>
<rect width="920" height="250" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
<text x="460" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Automatic _id generation</text>
<rect x="40" y="60" width="360" height="120" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="220.0" y="113.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Document without _id</text>
<text x="220.0" y="134.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666">{ name: &quot;Aisha Khan&quot; }</text>
<line x1="400" y1="120" x2="520" y2="120" stroke="#cc0000" stroke-width="2" marker-end="url(#ae45)"/>
<rect x="520" y="60" width="380" height="120" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="710.0" y="113.9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Stored document</text>
<text x="710.0" y="134.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666">_id: ObjectId(&quot;…&quot;)</text>
<text x="460" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">MongoDB assigns a unique ObjectId when you omit _id</text>
</svg>
