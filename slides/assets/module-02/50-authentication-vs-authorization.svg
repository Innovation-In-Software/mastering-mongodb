<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 344" width="920" height="344">
<defs>
  <marker id="ae50" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#cc0000"/>
  </marker>
</defs>
<rect width="920" height="344" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
<text x="460" y="28" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">Authentication vs. authorization</text>
<rect x="24" y="50" width="430" height="48" rx="10" fill="#ffebeb" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cc0000">Authentication</text>
<rect x="466" y="50" width="430" height="48" rx="10" fill="#ffebeb" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="78.0" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cc0000">Authorization</text>
<rect x="24" y="106" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="132.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Who are you?</text>
<rect x="466" y="106" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="132.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">What may you do?</text>
<rect x="24" y="158" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="184.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Username + password</text>
<rect x="466" y="158" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="184.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Roles and privileges</text>
<rect x="24" y="210" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="236.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Authentication database</text>
<rect x="466" y="210" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="236.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Per database / action</text>
<rect x="24" y="262" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="239.0" y="288.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Success: identity known</text>
<rect x="466" y="262" width="430" height="46" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="681.0" y="288.3" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Failure: unauthorized</text>
<text x="460" y="332" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">You can log in and still be forbidden to run a command</text>
</svg>
