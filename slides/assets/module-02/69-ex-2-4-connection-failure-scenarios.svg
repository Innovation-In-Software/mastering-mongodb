<text x="349.0" y="100.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1a1a1a">Network path</text>
<text x="349.0" y="118.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666">Timeout / allowlist</text>
