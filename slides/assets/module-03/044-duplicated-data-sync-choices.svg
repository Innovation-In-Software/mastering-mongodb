<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 272" width="920" height="272">
<defs>
  <marker id="ae" viewBox="0 0 10 10" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L9,5 L0,9 Z" fill="#cc0000"/>
  </marker>
</defs>
<rect width="920" height="272" fill="#f7f7f7" stroke="#d0d0d0" stroke-width="2"/>
<text x="460" y="26" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#1a1a1a">How should the copy stay in sync?</text>
<rect x="20" y="48" width="284" height="78" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="162.0" y="77.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Snapshot</text>
<text x="162.0" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Never update</text>
<rect x="318" y="48" width="284" height="78" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="460.0" y="77.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Synchronous</text>
<text x="460.0" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Write both now</text>
<rect x="616" y="48" width="284" height="78" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="758.0" y="77.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Event-based</text>
<text x="758.0" y="104.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Async update</text>
<rect x="20" y="140" width="284" height="78" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="162.0" y="169.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Periodic refresh</text>
<text x="162.0" y="196.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Batch rebuild</text>
<rect x="318" y="140" width="284" height="78" rx="10" fill="#ffffff" stroke="#cc0000" stroke-width="2"/>
<text x="460.0" y="169.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#1a1a1a">Eventual</text>
<text x="460.0" y="196.2" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#666666">Accept lag</text>
<text x="460" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#666666">For purchase-time price the answer is almost always snapshot</text>
</svg>
