<text x="240.0" y="69.6" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#1a1a1a">RPO</text>
<text x="240.0" y="110.4" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666666">How much data loss is tolerable (time)</text>
